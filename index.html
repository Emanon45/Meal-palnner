<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Plan — Canadian Flyer &amp; Macro Prep</title>
  <meta name="description" content="Offline-first Canadian meal prep planner with weekly Maxi vs. Super C flyer pricing and deterministic macro scaling.">
  <meta name="theme-color" content="#F6F3EC">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg: #F6F3EC;
      --surface: #FDFBF7;
      --surface-subtle: #EFECE4;
      --border: #DDD6C9;
      --border-strong: #B8AFA0;
      --text-main: #1B1917;
      --text-muted: #6B655C;
      --accent: #234E3D;
      --accent-tint: #E7EFEA;
      --deal: #B93829;
      --font-serif: "Newsreader", Georgia, serif;
      --font-sans: "Plus Jakarta Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      box-shadow: none !important;
    }

    [hidden] {
      display: none !important;
    }

    html {
      scroll-padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));
      font-family: var(--font-sans);
      color-scheme: light;
    }

    body {
      margin: 0;
      min-block-size: 100dvh;
      background: var(--bg);
      color: var(--text-main);
      overflow-wrap: break-word;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-inline-size: 430px;
      margin-inline: auto;
      min-block-size: 100dvh;
      padding-inline: 0.875rem;
      padding-block-start: max(0.875rem, env(safe-area-inset-top, 0px));
      padding-block-end: calc(5.5rem + env(safe-area-inset-bottom, 0px));
    }

    .app-shell > header {
      padding-block-end: 0.75rem;
      border-block-end: 1px solid var(--border-strong);
      margin-block-end: 0.25rem;
    }

    h1, h2, h3 {
      text-wrap: balance;
      margin: 0;
      color: var(--text-main);
    }

    h1,
    .meal-card h3 {
      font-family: var(--font-serif);
      letter-spacing: -0.01em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .meal-card h3 {
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.25;
    }

    p, li {
      text-wrap: pretty;
    }

    .app-shell main,
    .card,
    .meal-card,
    .grocery-row,
    .flex-wrap-row > * {
      min-inline-size: 0;
    }

    :where(a, code, .wrap-anywhere) {
      overflow-wrap: anywhere;
    }

    .flex-wrap-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      min-inline-size: 0;
    }

    fieldset.flex-wrap-row {
      border: 0;
      margin: 0;
      padding: 0;
    }

    .space-stack > * + * {
      margin-block-start: 0.625rem;
    }

    /* Flattened full-bleed sections separated by 1px hairline dividers */
    .card {
      background: transparent;
      border: 0;
      border-block-end: 1px solid var(--border);
      border-radius: 0;
      padding: 0.875rem 0;
      margin-block-end: 0;
    }

    .subcard {
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.625rem 0.75rem;
    }

    /* Tabular ledger numerals on weights, macros, timers, and prices */
    .prep-timer-readout,
    .grocery-row,
    .macro-track + div,
    .meal-card > div:nth-child(2),
    input[type="number"] {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .grocery-row {
      min-block-size: 52px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.625rem;
      padding: 0.5rem 0.25rem;
      border-block-end: 1px solid var(--border);
    }

    .grocery-row:last-child {
      border-block-end: 0;
    }

    .pill-btn,
    .btn-primary,
    .btn-secondary {
      min-block-size: 44px;
      min-inline-size: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.4375rem 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      cursor: pointer;
      max-inline-size: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: center;
    }

    .pill-btn:hover,
    .btn-secondary:hover {
      background: var(--surface-subtle);
    }

    .pill-btn[aria-pressed="true"] {
      background: var(--accent-tint);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--surface);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn-secondary {
      background: var(--surface-subtle);
    }

    input[type="number"],
    input[type="text"],
    textarea,
    select {
      min-block-size: 44px;
      background: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      padding: 0.5rem 0.625rem;
      font-family: var(--font-sans);
      font-size: 0.9375rem;
      max-inline-size: 100%;
    }

    label:has(input[type="checkbox"], input[type="radio"]) {
      min-block-size: 44px;
      min-inline-size: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding-inline: 0.125rem;
    }

    input[type="checkbox"] {
      inline-size: 1.25rem;
      block-size: 1.25rem;
      border-radius: 2px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    :where(a, button, input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .macro-track {
      inline-size: 100%;
      block-size: 0.5rem;
      border-radius: 2px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .macro-fill {
      block-size: 100%;
      inline-size: var(--pct, 0%);
      background: var(--accent);
      transition: inline-size 150ms ease;
    }

    .macro-fill[data-over="true"] {
      background: var(--deal);
    }

    [role="alert"].fat-alert {
      border: 1px solid var(--deal);
      border-left-width: 3px;
      background: var(--surface);
      color: var(--deal);
      border-radius: 2px;
      padding: 0.75rem 0.875rem;
      font-weight: 600;
      margin-block: 0.5rem;
    }

    .ok-banner {
      border: 1px solid var(--accent);
      background: var(--accent-tint);
      color: var(--accent);
      border-radius: 2px;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      margin-block: 0.5rem;
    }

    .thaw-banner {
      border: 1px solid var(--border-strong);
      border-left: 3px solid var(--deal);
      background: var(--surface);
      color: var(--text-main);
      border-radius: 2px;
      padding: 0.75rem 0.875rem;
      margin-block: 0.5rem;
    }

    /* Ink Stamp Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.1875rem 0.4375rem;
      border-radius: 2px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text-main);
      max-inline-size: 100%;
      overflow-wrap: anywhere;
    }

    .radar-historic,
    .radar-hot {
      background: transparent;
      border-color: var(--deal);
      color: var(--deal);
    }

    .radar-flyer {
      background: var(--accent-tint);
      border-color: var(--accent);
      color: var(--accent);
    }

    .radar-regular {
      background: transparent;
      border-color: var(--border-strong);
      color: var(--text-muted);
    }

    .prep-timer-readout {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      min-inline-size: 4.5rem;
    }

    .bottom-nav {
      position: fixed;
      inset-inline: 0;
      inset-block-end: 0;
      z-index: 40;
      background: var(--surface);
      border-block-start: 1px solid var(--border);
      padding-block-end: max(0.375rem, env(safe-area-inset-bottom, 0px));
      padding-inline: max(0.375rem, env(safe-area-inset-left, 0px)) max(0.375rem, env(safe-area-inset-right, 0px));
    }

    .bottom-tablist {
      max-inline-size: 430px;
      margin-inline: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.25rem;
    }

    [role="tab"] {
      position: relative;
      min-block-size: 48px;
      min-inline-size: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.125rem;
      background: transparent;
      border: 0;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.25rem 0.125rem;
    }

    [role="tab"][aria-selected="true"] {
      color: var(--accent);
    }

    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      border-block-start: 2px solid var(--accent);
    }

    /* Range Sliders: flat paper-and-ink track & square 2px thumb (no gradients) */
    input[type="range"].macro-slider {
      --slider-track-size: 0.375rem;
      --slider-thumb-size: 1.25rem;
      --slider-track-color: var(--border);
      --slider-thumb-color: var(--accent);
      appearance: none;
      inline-size: 100%;
      block-size: 2.75rem;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="range"].macro-slider::-webkit-slider-runnable-track {
      block-size: var(--slider-track-size);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      background: var(--surface-subtle);
    }

    input[type="range"].macro-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      margin-block-start: calc((var(--slider-track-size) - var(--slider-thumb-size)) / 2 - 1px);
      border: 1px solid var(--surface);
      border-radius: 2px;
      background: var(--slider-thumb-color);
    }

    input[type="range"].macro-slider::-moz-range-track {
      block-size: var(--slider-track-size);
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      background: var(--surface-subtle);
    }

    input[type="range"].macro-slider::-moz-range-progress {
      block-size: var(--slider-track-size);
      border-radius: 2px;
      background: var(--accent);
    }

    input[type="range"].macro-slider::-moz-range-thumb {
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      border: 1px solid var(--surface);
      border-radius: 2px;
      background: var(--slider-thumb-color);
    }

    /* Map existing utility classes in app.js to paper-and-ink tokens (online + offline) */
    .text-slate-100,
    .text-slate-200,
    .text-white {
      color: var(--text-main) !important;
    }

    .text-slate-300,
    .text-slate-400 {
      color: var(--text-muted) !important;
    }

    .text-emerald-400,
    .text-emerald-300,
    .text-emerald-200 {
      color: var(--accent) !important;
    }

    .text-amber-300,
    .text-amber-200 {
      color: var(--text-main) !important;
    }

    .text-red-300,
    .text-red-400 {
      color: var(--deal) !important;
    }

    .bg-slate-800,
    .bg-slate-900 {
      background-color: var(--surface) !important;
      color: var(--text-main) !important;
    }

    .border-slate-700,
    .border-slate-600 {
      border-color: var(--border) !important;
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="./js/macroEngine.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="mb-3 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-emerald-400">Meal Plan</h1>
        <p id="header-subtitle" class="text-xs text-slate-300">Canadian Flyer Prep</p>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <span id="header-store-badge" class="badge">Store: --</span>
        <span id="connectivity-badge" class="badge">Online</span>
      </div>
    </header>

    <div id="app-live-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <main id="app-main">
      <section role="tabpanel" id="panel-meals" aria-labelledby="tab-meals">
        <div id="meals-root" class="space-stack">
          <div class="card">
            <p class="text-sm text-slate-300">Loading Meal Plan...</p>
          </div>
        </div>
      </section>

      <section role="tabpanel" id="panel-prep" aria-labelledby="tab-prep" hidden>
        <div id="prep-root" class="space-stack"></div>
      </section>

      <section role="tabpanel" id="panel-groceries" aria-labelledby="tab-groceries" hidden>
        <section id="groceries-root" class="space-stack" aria-label="Grocery list"></section>
      </section>

      <section role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
        <div id="settings-root" class="space-stack"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Primary sections">
    <div role="tablist" aria-label="Meal Plan sections" class="bottom-tablist">
      <button type="button" role="tab" id="tab-meals" aria-selected="true" tabindex="0">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
        </svg>
        <span>Meals</span>
      </button>
      <button type="button" role="tab" id="tab-prep" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/>
        </svg>
        <span>Prep</span>
      </button>
      <button type="button" role="tab" id="tab-groceries" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        <span>Groceries</span>
      </button>
      <button type="button" role="tab" id="tab-settings" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Settings</span>
      </button>
    </div>
  </nav>
</body>
</html>

<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meal Plan — Canadian Flyer &amp; Macro Prep</title>
  <meta name="description" content="Offline-first Canadian meal prep planner with weekly Maxi vs. Super C flyer pricing and deterministic macro scaling.">
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html {
      scroll-padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-block-size: 100dvh;
      background: #0f172a;
      color: #f8fafc;
      overflow-wrap: break-word;
      line-height: 1.45;
    }

    .app-shell {
      max-inline-size: 430px;
      margin-inline: auto;
      min-block-size: 100dvh;
      padding-inline: 0.875rem;
      padding-block-start: max(0.75rem, env(safe-area-inset-top, 0px));
      padding-block-end: calc(5.5rem + env(safe-area-inset-bottom, 0px));
    }

    h1, h2, h3 {
      text-wrap: balance;
      margin: 0;
    }

    p, li {
      text-wrap: pretty;
    }

    .app-shell main,
    .card,
    .meal-card,
    .grocery-row,
    .flex-wrap-row > * {
      min-inline-size: 0;
    }

    :where(a, code, .wrap-anywhere) {
      overflow-wrap: anywhere;
    }

    .flex-wrap-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      min-inline-size: 0;
    }

    fieldset.flex-wrap-row {
      border: 0;
      margin: 0;
      padding: 0;
    }

    .space-stack > * + * {
      margin-block-start: 0.75rem;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.875rem;
      padding: 0.875rem;
      margin-block-end: 0.875rem;
    }

    .subcard {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.625rem;
      padding: 0.625rem 0.75rem;
    }

    .pill-btn,
    .btn-primary,
    .btn-secondary {
      min-block-size: 44px;
      min-inline-size: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      padding: 0.5rem 0.75rem;
      border-radius: 0.625rem;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      max-inline-size: 100%;
      text-align: center;
    }

    .pill-btn[aria-pressed="true"],
    .btn-primary {
      background: #059669;
      border-color: #34d399;
      color: #ffffff;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .btn-secondary {
      background: #1e293b;
    }

    input[type="number"],
    input[type="text"],
    select {
      min-block-size: 44px;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      padding: 0.5rem 0.625rem;
      font-size: 0.9375rem;
      max-inline-size: 100%;
    }

    label:has(input[type="checkbox"], input[type="radio"]) {
      min-block-size: 44px;
      min-inline-size: 44px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      padding-inline: 0.25rem;
    }

    input[type="checkbox"] {
      inline-size: 1.25rem;
      block-size: 1.25rem;
      accent-color: #10b981;
      cursor: pointer;
      flex-shrink: 0;
    }

    :where(a, button, input, select, textarea, [role="tab"], [tabindex]):focus-visible {
      outline: 2px solid #34d399;
      outline-offset: 2px;
    }

    .macro-track {
      inline-size: 100%;
      block-size: 0.625rem;
      border-radius: 999px;
      background: #0f172a;
      border: 1px solid #334155;
      overflow: hidden;
    }

    .macro-fill {
      block-size: 100%;
      inline-size: var(--pct, 0%);
      background: #10b981;
      transition: inline-size 150ms ease;
    }

    .macro-fill[data-over="true"] {
      background: #ef4444;
    }

    [role="alert"].fat-alert {
      border: 2px solid #f87171;
      background: rgba(127, 29, 29, 0.9);
      color: #fecaca;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-weight: 600;
      margin-block-end: 0.875rem;
    }

    .ok-banner {
      border: 1px solid #065f46;
      background: rgba(6, 78, 59, 0.45);
      color: #a7f3d0;
      border-radius: 0.75rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      margin-block-end: 0.875rem;
    }

    .thaw-banner {
      border: 1px solid #f59e0b;
      background: rgba(120, 53, 15, 0.55);
      color: #fde68a;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      margin-block-end: 0.875rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.1875rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      max-inline-size: 100%;
      overflow-wrap: anywhere;
    }

    .radar-historic {
      background: #064e3b;
      border-color: #34d399;
      color: #a7f3d0;
    }

    .radar-hot {
      background: #78350f;
      border-color: #fbbf24;
      color: #fde68a;
    }

    .radar-flyer {
      background: #1e3a8a;
      border-color: #60a5fa;
      color: #bfdbfe;
    }

    .radar-regular {
      background: #1e293b;
      border-color: #475569;
      color: #cbd5e1;
    }

    .prep-timer-readout {
      font-variant-numeric: tabular-nums;
      font-size: 1.25rem;
      font-weight: 700;
      color: #34d399;
      min-inline-size: 4.5rem;
    }

    .bottom-nav {
      position: fixed;
      inset-inline: 0;
      inset-block-end: 0;
      z-index: 40;
      background: #0f172a;
      border-block-start: 1px solid #334155;
      padding-block-end: max(0.375rem, env(safe-area-inset-bottom, 0px));
      padding-inline: max(0.375rem, env(safe-area-inset-left, 0px)) max(0.375rem, env(safe-area-inset-right, 0px));
    }

    .bottom-tablist {
      max-inline-size: 430px;
      margin-inline: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.25rem;
    }

    [role="tab"] {
      position: relative;
      min-block-size: 48px;
      min-inline-size: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.125rem;
      background: transparent;
      border: 0;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0.25rem 0.125rem;
    }

    [role="tab"][aria-selected="true"] {
      color: #34d399;
    }

    [role="tab"][aria-selected="true"]::after {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      border-block-start: 3px solid currentColor;
    }

    /* Range Sliders: separate WebKit/Blink and Firefox pseudo-element blocks */
    input[type="range"].macro-slider {
      --slider-track-size: 0.5rem;
      --slider-thumb-size: 1.375rem;
      --slider-track-color: #334155;
      --slider-fill-color: #10b981;
      --slider-thumb-color: #34d399;
      --slider-pct: 50%;
      appearance: none;
      inline-size: 100%;
      block-size: 2.75rem;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      accent-color: #10b981;
      cursor: pointer;
    }

    input[type="range"].macro-slider::-webkit-slider-runnable-track {
      block-size: var(--slider-track-size);
      border: 0;
      border-radius: 999px;
      background: linear-gradient(
        to right,
        var(--slider-fill-color) var(--slider-pct),
        var(--slider-track-color) var(--slider-pct)
      );
    }

    input[type="range"].macro-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      margin-block-start: calc((var(--slider-track-size) - var(--slider-thumb-size)) / 2);
      border: 2px solid #0f172a;
      border-radius: 50%;
      background: var(--slider-thumb-color);
    }

    input[type="range"].macro-slider::-moz-range-track {
      block-size: var(--slider-track-size);
      border: 0;
      border-radius: 999px;
      background: var(--slider-track-color);
    }

    input[type="range"].macro-slider::-moz-range-progress {
      block-size: var(--slider-track-size);
      border-radius: 999px;
      background: var(--slider-fill-color);
    }

    input[type="range"].macro-slider::-moz-range-thumb {
      inline-size: var(--slider-thumb-size);
      block-size: var(--slider-thumb-size);
      border: 2px solid #0f172a;
      border-radius: 50%;
      background: var(--slider-thumb-color);
    }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="./js/macroEngine.js"></script>
  <script defer src="./js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="mb-3 flex flex-wrap items-center justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-emerald-400">Meal Plan</h1>
        <p id="header-subtitle" class="text-xs text-slate-300">Canadian Flyer Prep • Zero Added Oil</p>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">
        <span id="header-store-badge" class="badge">Store: --</span>
        <span id="connectivity-badge" class="badge">Online</span>
      </div>
    </header>

    <div id="app-live-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

    <main id="app-main">
      <section role="tabpanel" id="panel-meals" aria-labelledby="tab-meals">
        <div id="meals-root" class="space-stack">
          <div class="card">
            <p class="text-sm text-slate-300">Loading Meal Plan...</p>
          </div>
        </div>
      </section>

      <section role="tabpanel" id="panel-prep" aria-labelledby="tab-prep" hidden>
        <div id="prep-root" class="space-stack"></div>
      </section>

      <section role="tabpanel" id="panel-groceries" aria-labelledby="tab-groceries" hidden>
        <section id="groceries-root" class="space-stack" aria-label="Grocery list"></section>
      </section>

      <section role="tabpanel" id="panel-settings" aria-labelledby="tab-settings" hidden>
        <div id="settings-root" class="space-stack"></div>
      </section>
    </main>
  </div>

  <nav class="bottom-nav" aria-label="Primary sections">
    <div role="tablist" aria-label="Meal Plan sections" class="bottom-tablist">
      <button type="button" role="tab" id="tab-meals" aria-selected="true" tabindex="0">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
        </svg>
        <span>Meals</span>
      </button>
      <button type="button" role="tab" id="tab-prep" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/>
        </svg>
        <span>Prep</span>
      </button>
      <button type="button" role="tab" id="tab-groceries" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>
        </svg>
        <span>Groceries</span>
      </button>
      <button type="button" role="tab" id="tab-settings" aria-selected="false" tabindex="-1">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Settings</span>
      </button>
    </div>
  </nav>
</body>
</html>
